# Solo el backend se containeriza (el frontend corre via `npm run dev` / Vercel,
# y la base de datos vive en Supabase cloud, no local).
version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app  # hot-reload en dev, quitar en prod
